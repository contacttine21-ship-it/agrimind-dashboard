<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgriMind AI — Tableau de bord partenaires</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --green: #1e6b3e;
    --green-dark: #0f3d24;
    --cream: #faf7f0;
    --amber: #e8a53c;
    --red: #e0533d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--cream);
    color: #1f2937;
  }
  header {
    background: linear-gradient(160deg, var(--green), var(--green-dark));
    color: white;
    padding: 24px 20px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  #login-view {
    max-width: 360px;
    margin: 60px auto;
    background: white;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.08);
  }
  #login-view h2 { margin-top: 0; font-size: 17px; }
  #login-view label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-top: 12px; }
  #login-view input {
    width: 100%;
    padding: 10px 12px;
    margin-top: 4px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 14px;
  }
  #login-view button {
    width: 100%;
    margin-top: 18px;
    padding: 11px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #error-msg { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }
  #dashboard-view { display: none; max-width: 900px; margin: 0 auto; padding: 20px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .toolbar button {
    background: none; border: 1px solid #ccc; border-radius: 8px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card {
    background: white; border-radius: 14px; padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); cursor: pointer;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .card-name { font-weight: 700; font-size: 15px; }
  .badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: white;
  }
  .reliability { font-size: 11px; color: #888; margin-top: 4px; }
  .reliability-bar { height: 4px; border-radius: 2px; background: #eee; margin-top: 3px; overflow: hidden; }
  .reliability-bar div { height: 100%; background: var(--green); }
  .metrics { margin-top: 10px; font-size: 12px; color: #444; }
  .metrics div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #eee; }
  .score { font-size: 26px; font-weight: 800; margin-top: 4px; }
  .zones { display: none; margin-top: 10px; background: #f7f7f5; border-radius: 10px; padding: 10px; }
  .zones.open { display: block; }
  .zone-row { font-size: 11px; padding: 4px 0; border-bottom: 1px solid #ececec; }
  .chart-title { font-size: 11px; font-weight: 600; color: #555; margin-top: 12px; }
  .chart-empty { font-size: 11px; color: #999; margin-top: 4px; }
  .empty { text-align: center; color: #888; margin-top: 60px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>AgriMind AI</h1>
  <p>Tableau de bord partenaires — Banques · Assurances · Investisseurs · Chercheurs</p>
</header>

<div id="login-view">
  <h2>Connexion partenaire</h2>
  <label>E-mail</label>
  <input id="login-email" type="email" autocomplete="username" />
  <label>Mot de passe</label>
  <input id="login-password" type="password" autocomplete="current-password" />
  <button onclick="login()">Se connecter</button>
  <p id="error-msg"></p>
</div>

<div id="dashboard-view">
  <div class="toolbar">
    <span id="who"></span>
    <button onclick="logout()">Déconnexion</button>
  </div>
  <div id="content"><p class="empty">Chargement…</p></div>
</div>

<script>
  const supabaseUrl = "https://lqdchxqphytuiszsnosx.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxZGNoeHFwaHl0dWlzenNub3N4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MjE1ODUsImV4cCI6MjEwNDM5NzU4NX0.CoqGBMv6PGdxYz7UgfQCRL9FCg3ePyOli8xbTF2W-nw";
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  const profilInfo = {
    1: { label: "Risque faible", color: "#1e6b3e" },
    2: { label: "Risque élevé", color: "#e0533d" },
    3: { label: "Risque moyen", color: "#e8a53c" },
  };

  async function login() {
    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;
    document.getElementById("error-msg").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      document.getElementById("error-msg").textContent = "Connexion refusée : " + error.message;
      return;
    }
    showDashboard();
  }

  async function logout() {
    await sb.auth.signOut();
    document.getElementById("dashboard-view").style.display = "none";
    document.getElementById("login-view").style.display = "block";
  }

  async function showDashboard() {
    document.getElementById("login-view").style.display = "none";
    document.getElementById("dashboard-view").style.display = "block";

    const { data: { user } } = await sb.auth.getUser();
    document.getElementById("who").textContent = "Connecté : " + (user?.email || "");

    const [{ data: profiles, error: err1 }, { data: zones, error: err2 }, { data: recoltes }] = await Promise.all([
      sb.rpc("get_farmer_risk_profiles"),
      sb.rpc("get_farmer_zone_breakdown"),
      sb.rpc("get_farmer_recoltes_history"),
    ]);

    const content = document.getElementById("content");
    if (err1) {
      content.innerHTML = `<p class="empty">Accès refusé : ${err1.message}</p>`;
      return;
    }
    if (!profiles || profiles.length === 0) {
      content.innerHTML = `<p class="empty">Aucun agriculteur avec des données pour le moment.</p>`;
      return;
    }

    const zonesByUser = {};
    (zones || []).forEach((z) => {
      zonesByUser[z.user_id] = zonesByUser[z.user_id] || [];
      zonesByUser[z.user_id].push(z);
    });

    const recoltesByUser = {};
    (recoltes || []).forEach((r) => {
      recoltesByUser[r.user_id] = recoltesByUser[r.user_id] || [];
      recoltesByUser[r.user_id].push(r);
    });

    content.innerHTML = `<div class="grid">${profiles.map((p, i) => cardHTML(p, i, zonesByUser[p.user_id] || [], recoltesByUser[p.user_id] || [])).join("")}</div>`;
  }

  function sparklineSVG(values) {
    if (!values || values.length < 2) return null;
    const w = 220, h = 60, pad = 6;
    const min = Math.min(...values), max = Math.max(...values);
    const range = max - min || 1;
    const step = (w - pad * 2) / (values.length - 1);
    const points = values.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x},${y}`;
    });
    const last = points[points.length - 1].split(",");
    return `
      <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
        <polyline points="${points.join(" ")}" fill="none" stroke="#1e6b3e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
        <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="#1e6b3e" />
      </svg>
    `;
  }

  function cardHTML(p, i, zoneList, recolteList) {
    const info = p.profil_risque
      ? (profilInfo[p.profil_risque] || { label: "Inconnu", color: "#9ca3af" })
      : { label: "Données insuffisantes", color: "#9ca3af" };
    const fiabilite = p.fiabilite_donnees_pct ?? 0;
    const zonesHTML = zoneList.map((z) => `
      <div class="zone-row">
        <strong>${z.zone}</strong> — ${(z.superficie_zone || 0).toFixed(1)} ha ·
        rendement moyen ${z.rendement_moyen_zone != null ? z.rendement_moyen_zone.toFixed(1) + " t/ha" : "N/A"} ·
        risque climatique ${z.risque_climatique_zone}
      </div>
    `).join("") || `<p style="font-size:11px;color:#999;">Aucune zone renseignée.</p>`;

    const rendements = recolteList.map((r) => Number(r.rendement));
    const chart = sparklineSVG(rendements);
    const chartHTML = chart
      ? `<div class="chart-title">Évolution du rendement (${recolteList.length} saisons)</div>${chart}`
      : `<div class="chart-title">Évolution du rendement</div><p class="chart-empty">Pas assez de saisons enregistrées pour tracer une courbe (minimum 2).</p>`;

    return `
      <div class="card" onclick="document.getElementById('zones-${i}').classList.toggle('open')">
        <div class="card-top">
          <div>
            <div class="card-name">${p.nom || "Agriculteur sans nom"}</div>
            <div class="score" style="color:${info.color}">${p.score_sur_100 ?? "—"}<span style="font-size:13px;color:#999;">/100</span></div>
          </div>
          <span class="badge" style="background:${info.color}">${info.label}</span>
        </div>
        <div class="reliability">Fiabilité des données : ${fiabilite}%</div>
        <div class="reliability-bar"><div style="width:${fiabilite}%"></div></div>
        <div class="metrics">
          <div><span>Superficie totale</span><span>${(p.superficie_totale_ha || 0).toFixed(1)} ha</span></div>
          <div><span>Rendement moyen pondéré</span><span>${p.rendement_moyen_t_ha != null ? p.rendement_moyen_t_ha.toFixed(1) + " t/ha" : "N/A"}</span></div>
          <div><span>Projection rendement futur</span><span>${p.projection_rendement_t_ha != null ? p.projection_rendement_t_ha.toFixed(1) + " t/ha" : "N/A"}</span></div>
          <div><span>Zones cultivées</span><span>${p.nb_zones}</span></div>
          <div><span>Saisons suivies</span><span>${p.nb_saisons_historique}</span></div>
          <div><span>Activités enregistrées</span><span>${p.nb_activites}</span></div>
        </div>
        ${chartHTML}
        <div class="zones" id="zones-${i}">${zonesHTML}</div>
      </div>
    `;
  }

  // Reprend la session si déjà connecté
  sb.auth.getSession().then(({ data }) => {
    if (data.session) showDashboard();
  });
</script>

</body>
</html>
